# Promoción manual a producción: publica una OTA al canal `production`
# (toda la flota). Solo se ejecuta a mano desde la pestaña Actions,
# después de validar la actualización en los teléfonos piloto (canal preview).
name: Actualización OTA (producción)

on:
  workflow_dispatch:

jobs:
  update:
    name: Publicar OTA a producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publicar actualización (producción)
        run: eas update --channel production --message "OTA update (producción)" --non-interactive
