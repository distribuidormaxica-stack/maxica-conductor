name: Construir APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Construir APK en EAS
        run: |
          eas build --profile production --platform android --non-interactive 2>&1 | tee build_log.txt
          grep -oP 'https://expo\.dev/artifacts/eas/[^\s]+\.apk' build_log.txt | head -1 > apk_url.txt
          echo "URL encontrada:"
          cat apk_url.txt

      - name: Descargar APK
        run: |
          APK_URL=$(cat apk_url.txt)
          if [ -z "$APK_URL" ]; then
            echo "ERROR: No se encontró la URL del APK en el log"
            cat build_log.txt
            exit 1
          fi
          curl -L "$APK_URL" -o maxica-conductor.apk
          ls -lh maxica-conductor.apk

      - name: Publicar en GitHub Releases
        run: |
          gh release delete apk-latest --yes 2>/dev/null || true
          gh release create apk-latest maxica-conductor.apk \
            --title "Maxica Conductor" \
            --notes "Última versión. Descarga e instala en Android."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
