name: Construir APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Construir APK en EAS
        run: |
          eas build --profile production --platform android --non-interactive --json > build.json
          echo "--- build.json ---"; cat build.json
          APK_URL=$(jq -r 'if type=="array" then .[0] else . end | .artifacts.applicationArchiveUrl // empty' build.json)
          if [ -z "$APK_URL" ]; then
            echo "ERROR: no se encontró applicationArchiveUrl en la salida de EAS"
            cat build.json
            exit 1
          fi
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"
          echo "URL: $APK_URL"

      - name: Descargar APK
        run: |
          curl -L "$APK_URL" -o maxica-conductor.apk
          ls -lh maxica-conductor.apk

      - name: Publicar en GitHub Releases
        run: |
          gh release delete apk-latest --yes 2>/dev/null || true
          gh release create apk-latest maxica-conductor.apk \
            --title "Maxica Conductor" \
            --notes "Última versión. Descarga e instala en Android."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
