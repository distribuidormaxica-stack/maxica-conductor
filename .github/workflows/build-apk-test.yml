name: Construir APK de PRUEBA

# Build de prueba (perfil preview, canal aislado) para validar el tracking en
# segundo plano SIN afectar a los choferes en producción. Publica en el release
# 'apk-test' (separado del 'apk-latest' estable). Solo manual.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK prueba
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Construir APK en EAS (perfil preview)
        run: |
          eas build --profile preview --platform android --non-interactive --json > build.json
          echo "--- build.json ---"; cat build.json
          APK_URL=$(jq -r 'if type=="array" then .[0] else . end | .artifacts.applicationArchiveUrl // empty' build.json)
          if [ -z "$APK_URL" ]; then
            echo "ERROR: no se encontró applicationArchiveUrl en la salida de EAS"
            cat build.json
            exit 1
          fi
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"
          echo "URL: $APK_URL"

      - name: Descargar APK
        run: |
          curl -L "$APK_URL" -o maxica-conductor-prueba.apk
          ls -lh maxica-conductor-prueba.apk

      - name: Publicar en GitHub Releases (apk-test)
        run: |
          gh release delete apk-test --yes 2>/dev/null || true
          gh release create apk-test maxica-conductor-prueba.apk \
            --title "Maxica Conductor — PRUEBA (background tracking)" \
            --notes "Build de prueba para validar el seguimiento en segundo plano. NO es la versión estable. Instala en un teléfono de prueba."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
