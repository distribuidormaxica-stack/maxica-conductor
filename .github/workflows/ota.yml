# Flujo OTA en dos etapas:
#   1. Cada push a main publica al canal `preview` (solo teléfonos piloto).
#   2. Tras validar en los pilotos, se promueve manualmente a `production`
#      (toda la flota) ejecutando el workflow ota-production.yml
#      (Actions → "Actualización OTA (producción)" → Run workflow).
name: Actualización OTA (preview)

on:
  push:
    branches: [main]

jobs:
  update:
    name: Publicar OTA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publicar actualización (preview)
        run: eas update --channel preview --message "OTA update (preview)" --non-interactive
