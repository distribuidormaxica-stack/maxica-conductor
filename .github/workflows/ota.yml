name: Actualización OTA

on:
  push:
    branches: [main]

jobs:
  update:
    name: Publicar OTA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publicar actualización
        run: eas update --channel production --message "OTA update" --non-interactive
